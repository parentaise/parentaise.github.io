<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — (parent)aise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#FBFDF9;color:#16251B;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
  h1{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:clamp(2.4rem,6vw,4rem);line-height:1.08;letter-spacing:-0.03em;color:#14301F;margin-bottom:16px;}
  p{font-size:1rem;color:#3A5240;max-width:440px;line-height:1.6;margin-bottom:36px;}
  a{display:inline-flex;align-items:center;gap:8px;padding:15px 30px;border-radius:28px;background:linear-gradient(135deg,#C9A961,#2F7A3A);color:#fff;font-weight:700;font-size:0.92rem;text-decoration:none;box-shadow:0 16px 32px -12px rgba(47,122,58,0.55);transition:transform .25s ease,box-shadow .25s ease;}
  a:hover{transform:translateY(-3px);box-shadow:0 24px 44px -14px rgba(47,122,58,0.65);}
  .code{font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:#2F7A3A;margin-bottom:20px;}
</style>
</head>
<body>
  <div class="code">Erreur 404</div>
  <h1>Cette page s'est<br>perdue en forêt</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour retrouver votre chemin.</p>
  <a href="./index.html">← Retour à l'accueil</a>
</body>
</html>
